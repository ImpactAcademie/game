<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panthère noire</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #242830; }
    canvas { display: block; }
    .character-state, .controls, .credits-button, .credits-dialog {
      padding: 7px 10px;
      border: 1px solid #596678;
      border-radius: 5px;
      background: #202630;
      color: #e1e7ef;
      font: 500 14px system-ui, sans-serif;
    }
    .character-state, .controls, .credits-trigger, .lives { position: fixed; z-index: 1; }
    .character-state { top: 12px; left: 12px; }
    .run-distance { display: block; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .controls { bottom: 12px; right: 12px; left: 12px; width: fit-content; }
    .credits-trigger { top: 56px; right: 12px; }
    .lives {
      top: 12px;
      right: 12px;
      padding: 3px 9px 5px;
      border: 1px solid #69404d;
      border-radius: 7px;
      background: #202630;
    }
    .life-hearts { display: flex; gap: 4px; color: #ff7188; font: 25px/1.15 system-ui, sans-serif; }
    .life-hearts .empty { color: #aa8592; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    .damage-flash {
      position: fixed;
      z-index: 2;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(ellipse at center, #5e001117 10%, #9d082d7a 65%, #8e001ede 100%);
    }
    .credits-button { cursor: pointer; }
    .credits-dialog { box-sizing: border-box; width: min(420px, calc(100% - 24px)); padding: 20px; }
    .credits-dialog::backdrop { background: rgb(0 0 0 / 58%); }
    .credits-dialog h2 { margin: 0; font-size: 20px; }
    .credits-dialog ul { padding-left: 20px; line-height: 1.6; }
    .credits-dialog a { color: #b4d9ff; }
    #game-over { max-height: calc(100% - 24px); overflow: auto; }
    #game-over h3 { margin-bottom: 6px; }
    #score-list { margin-top: 0; padding-left: 26px; line-height: 1.5; }
  </style>
  <script type="importmap">
    {"imports":{"three":"/three.module.js"}}
  </script>
</head>
<body>
  <div class="character-state" role="status">État <strong id="character-state">Repos</strong>
    <span id="hunt-status"></span>
    <span class="run-distance" aria-live="off">Distance <strong id="run-distance">0 m</strong></span>
  </div>
  <div class="lives" role="status">
    <span id="life-count" class="sr-only">5 vies sur 5</span>
    <div id="life-hearts" class="life-hearts" aria-hidden="true">
      <span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span>
    </div>
  </div>
  <div id="damage-flash" class="damage-flash" aria-hidden="true"></div>
  <button type="button" id="open-credits" class="credits-button credits-trigger" aria-haspopup="dialog">Crédits</button>
  <dialog id="credits" class="credits-dialog" aria-labelledby="credits-title">
    <h2 id="credits-title">Crédits</h2>
    <ul>
      <li><a href="https://poly.pizza/m/JcAlAQynld">Black Panther</a> by Google Data Arts Team
        [<a href="https://creativecommons.org/licenses/by/3.0/">CC-BY</a>] via Poly Pizza</li>
    </ul>
    <form method="dialog">
      <button class="credits-button" autofocus>Fermer</button>
    </form>
  </dialog>
  <dialog id="game-over" class="credits-dialog" aria-labelledby="game-over-title">
    <h2 id="game-over-title">Partie terminée</h2>
    <p id="game-over-reason"></p>
    <p>Distance parcourue <strong id="final-distance"></strong></p>
    <h3>Meilleures distances</h3>
    <p id="score-status" role="status">Enregistrement du score…</p>
    <ol id="score-list"></ol>
    <button type="button" id="restart-game" class="credits-button" autofocus>Rejouer</button>
  </dialog>
  <div class="controls">
    Fuir le rocher <kbd>Maj</kbd> + <kbd>←</kbd> ·
    Franchir la rivière et les obstacles <kbd>Espace</kbd> ·
    Marcher <kbd>←</kbd> <kbd>→</kbd>
  </div>
  <script>
    const credits = document.getElementById('credits');
    document.getElementById('open-credits').addEventListener('click', () => credits.showModal());
  </script>
  <script type="module" src="/panther.js"></script>
</body>
</html>
